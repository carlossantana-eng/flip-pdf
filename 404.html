<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada — FlipPDF</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke='%2388da10' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M24 11c-4.6-3-12.4-3.3-17.2-.8v22c4.8-2.5 12.6-2.2 17.2.8Z'/%3E%3Cpath d='M24 11c4.6-3 12.4-3.3 17.2-.8v22c-4.8-2.5-12.6-2.2-17.2.8Z'/%3E%3Cpath d='M6.8 35.8c4.8-2.5 12.6-2.2 17.2.8 4.6-3 12.4-3.3 17.2-.8'/%3E%3Cpath d='M24 9.5c5.4-1.4 11-.2 14.9 3.2-2.6 7.5-6.4 14.4-11.3 20.1-1 1.2-2.2 2.3-3.6 3 .7-1.9 1-3.7.8-5.5Z'/%3E%3C/svg%3E">
  <!-- Página autocontida: o GitHub Pages a serve em qualquer caminho
       inexistente, então nada aqui pode depender de URL relativa. -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #e8ede2;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .caixa { max-width: 460px; }
    .codigo {
      font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
      font-size: clamp(3.4rem, 12vw, 5.5rem);
      font-weight: 700;
      color: #88da10;
      margin: 0;
      line-height: 1;
      text-shadow: 0 0 34px rgba(136, 218, 16, 0.35);
    }
    h1 { font-size: 1.3rem; margin: 14px 0 8px; }
    p { margin: 0 0 24px; color: rgba(232, 237, 226, 0.65); line-height: 1.55; }
    .acoes { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.botao {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      background: #88da10;
      color: #10130c;
    }
    a.fantasma { background: transparent; color: #e8ede2; border: 1px solid rgba(232, 237, 226, 0.3); }
    a.botao:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div class="caixa">
    <p class="codigo">404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço pode ter mudado ou o flipbook pode ter sido removido.</p>
    <div class="acoes">
      <a class="botao" id="ir-estante" href="/">Abrir a estante</a>
      <a class="botao fantasma" id="ir-inicio" href="/">Página inicial</a>
    </div>
  </div>
  <script>
    // Em "project pages" o site vive em /<repo>/ — deriva a raiz do próprio caminho.
    (function () {
      var partes = location.pathname.split('/').filter(Boolean);
      var raiz = partes.length > 0 ? '/' + partes[0] + '/' : '/';
      document.getElementById('ir-estante').href = raiz + 'estante.html';
      document.getElementById('ir-inicio').href = raiz;
    })();
  </script>
</body>
</html>
