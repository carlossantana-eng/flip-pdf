<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flipbook</title>
  <link rel="stylesheet" href="assets/css/estilo.css?v=__VERSAO__">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke='%23a3e635' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M24 13.5C19.4 10 11.4 10 6.5 13V34c4.9-3 12.9-3 17.5.5Z'/%3E%3Cpath d='M24 13.5c3.2-2.4 7.6-3.3 11.8-2.8'/%3E%3Cpath d='M41.5 14.5V34c-1.9-1.15-4.1-1.85-6.4-2.1'/%3E%3Cpath d='M6.5 37c4.9-3 12.9-3 17.5.5 4.6-3.5 12.6-3.5 17.5-.5'/%3E%3Cpath d='M24 34c1.5-9.8 6.4-18.4 16.4-23.9-3.1 6.8-4.9 14.6-5.3 21.7-3.8-.5-7.8.3-11.1 2.2Z'/%3E%3C/svg%3E">
</head>
<body class="leitor">
  <header class="leitor-topo">
    <a class="botao-icone" href="estante.html" title="Voltar para a estante" aria-label="Voltar para a estante">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </a>
    <img class="leitor-logo" id="leitor-logo" alt="" hidden>
    <h1 id="titulo">Carregando…</h1>
    <div class="leitor-acoes">
      <button class="botao-icone" id="btn-compartilhar" title="Compartilhar link" aria-label="Compartilhar link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg>
      </button>
      <a class="botao-icone" id="btn-baixar" title="Baixar PDF" aria-label="Baixar PDF" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></svg>
      </a>
    </div>
  </header>

  <div class="progresso" id="progresso"><div class="progresso-barra" id="progresso-barra"></div></div>

  <main class="palco" id="palco">
    <button class="seta seta-anterior" id="btn-anterior" aria-label="Página anterior" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="livro-moldura"><div id="livro"></div></div>
    <button class="seta seta-proxima" id="btn-proximo" aria-label="Próxima página" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </button>

    <div class="estado" id="carregando">
      <div class="girador" aria-hidden="true"></div>
      <p id="carregando-texto">Preparando o flipbook…</p>
    </div>

    <div class="estado" id="erro" hidden>
      <h2 id="erro-titulo">Não foi possível abrir o flipbook</h2>
      <p id="erro-texto">Verifique sua conexão e tente novamente.</p>
      <a class="botao" href="estante.html">Voltar para a estante</a>
    </div>
  </main>

  <footer class="leitor-rodape">
    <button class="botao-icone" id="btn-miniaturas" title="Miniaturas das páginas" aria-label="Miniaturas das páginas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <button class="botao-icone" id="btn-ampliar" title="Ampliar página" aria-label="Ampliar página">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M11 8v6M8 11h6"/></svg>
    </button>
    <button class="botao-icone" id="btn-musica" title="Tocar a música de fundo" aria-label="Música de fundo" aria-pressed="false" hidden></button>
    <span class="indicador" id="indicador">– / –</span>
    <input type="range" class="controle-progresso" id="controle-progresso" min="1" max="1" step="1" value="1" aria-label="Ir para a página">
    <button class="botao-icone" id="btn-tela-cheia" title="Tela cheia" aria-label="Tela cheia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
    </button>
  </footer>

  <div class="miniaturas" id="miniaturas" hidden>
    <div class="miniaturas-topo">
      <h2>Páginas</h2>
      <button class="botao-icone" id="miniaturas-fechar" title="Fechar" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="miniaturas-grade" id="miniaturas-grade"></div>
  </div>

  <div class="lupa" id="lupa" hidden>
    <div class="lupa-topo">
      <button class="botao-icone" id="lupa-anterior" title="Página anterior" aria-label="Página anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span class="indicador" id="lupa-indicador">–</span>
      <button class="botao-icone" id="lupa-proxima" title="Próxima página" aria-label="Próxima página">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <button class="botao-icone" id="lupa-fechar" title="Fechar" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="lupa-corpo" id="lupa-corpo"><img id="lupa-imagem" alt="Página ampliada"></div>
    <div class="lupa-zoom-lateral" aria-label="Controle de zoom">
      <button class="botao-icone" id="lupa-mais" title="Ampliar" aria-label="Ampliar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <input type="range" id="lupa-controle" min="0" max="300" step="5" value="0" aria-label="Nível de ampliação">
      <button class="botao-icone" id="lupa-menos" title="Reduzir" aria-label="Reduzir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <span class="indicador" id="lupa-zoom">0</span>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="assets/vendor/page-flip.browser.js?v=__VERSAO__"></script>
  <script type="module" src="assets/js/leitor.js?v=__VERSAO__"></script>
</body>
</html>
