<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Minhas Estantes</title>
  <link rel="stylesheet" href="assets/css/estilo.css?v=__VERSAO__">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke='%23a3e635' stroke-width='2.5' stroke-linejoin='round'%3E%3Cpath d='M22 11 33 4v24l-11 7z' fill='%23a3e635' stroke='%23060803' stroke-width='1.6'/%3E%3Cpath d='M15 14 26 7v24l-11 7z' fill='%23a3e635' stroke='%23060803' stroke-width='1.6'/%3E%3Cpath d='M8 17 19 10v24l-11 7z' fill='%23a3e635' stroke='%23060803' stroke-width='1.6'/%3E%3Cpath d='M7 22l17 9 17-9v13L24 44 7 35z' fill='%230c0f07'/%3E%3Cpath d='M24 31v13' stroke-width='1.8'/%3E%3C/svg%3E">
  <script>try { if (localStorage.getItem('plataforma-tema') === 'claro') document.documentElement.dataset.tema = 'claro'; } catch (e) { /* sem armazenamento */ }</script>
  <script src="assets/js/tema.js?v=__VERSAO__" defer></script>
</head>
<body class="admin">
  <header class="barra-topo">
    <a class="marca" href="admin.html">
      Estantes<span class="ponto">.</span>
    </a>
    <a class="logo-central" href="index.html" title="FlipPDF" aria-label="FlipPDF"><span class="marca-icone" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M22 11 33 4v24l-11 7z" fill="currentColor" stroke="#060803" stroke-width="1.6"/><path d="M15 14 26 7v24l-11 7z" fill="currentColor" stroke="#060803" stroke-width="1.6"/><path d="M8 17 19 10v24l-11 7z" fill="currentColor" stroke="#060803" stroke-width="1.6"/><path d="M7 22l17 9 17-9v13L24 44 7 35z" fill="#0c0f07"/><path d="M24 31v13" stroke-width="1.8"/></svg></span></a>
    <div class="barra-acoes">
      <a class="botao-publicar" href="admin.html">← Painel</a>
    </div>
  </header>

  <main class="arquivos-corpo">

    <section class="cartao-admin" id="sem-chave" hidden>
      <h2>Conecte-se primeiro</h2>
      <p>Esta página usa a mesma chave do painel. Conecte-se por lá e volte aqui.</p>
      <a class="botao" href="admin.html">Abrir o painel</a>
    </section>

    <div id="gerenciador" hidden>

      <div class="arquivos-topo">
        <h1 class="publicar-titulo estantes-titulo">Minhas Estantes</h1>
        <div class="arquivos-ferramentas">
          <input id="busca-estantes" type="search" placeholder="Pesquisar…" aria-label="Pesquisar estante">
          <button class="botao" id="btn-nova-estante">+ Nova Estante</button>
        </div>
      </div>

      <div class="lista-estantes" id="lista-estantes"></div>

    </div>

    <div class="estado-admin" id="erro-geral" hidden>
      <h2>Algo deu errado</h2>
      <p id="erro-geral-texto"></p>
      <button class="botao" onclick="location.reload()">Recarregar</button>
    </div>

  </main>

  <dialog class="dialogo" id="dialogo-catalogos">
    <h2 id="dialogo-catalogos-titulo">Adicionar catálogos</h2>
    <p class="dica">Marque o que deve aparecer nesta estante. O que for
      desmarcado volta para a estante principal.</p>
    <div class="opcoes-pasta" id="opcoes-catalogos"></div>
    <div class="publicar-rodape">
      <button class="botao botao-suave" id="catalogos-cancelar">Cancelar</button>
      <button class="botao" id="catalogos-salvar">Salvar</button>
    </div>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="assets/js/estantes.js?v=__VERSAO__"></script>
</body>
</html>
