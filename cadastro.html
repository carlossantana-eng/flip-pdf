<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — FlipPDF</title>
  <link rel="stylesheet" href="assets/css/estilo.css?v=__VERSAO__">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke='%23a3e635'%3E%3Crect x='3' y='3' width='42' height='42' rx='10' stroke-width='3.6'/%3E%3Cpath d='M12 14v20' stroke-width='2.8' stroke-linecap='round'/%3E%3Cpath d='M12 18h3.5M12 24h3.5M12 30h3.5' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M22 33.5V15l10.5-4.5v18L22 33.5Z' stroke-width='2.8' stroke-linejoin='round'/%3E%3Cpath d='M34.5 12.5c2.6 1.7 3.5 3 3.5 5.5v10c0 2.5-1.2 4-3.8 5.5' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="barra-topo">
    <a class="marca" href="index.html">
      <span class="marca-icone" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor"><rect x="3" y="3" width="42" height="42" rx="10" stroke-width="3.6"/><path d="M12 14v20" stroke-width="2.8" stroke-linecap="round"/><path d="M12 18h3.5M12 24h3.5M12 30h3.5" stroke-width="2.4" stroke-linecap="round"/><path d="M22 33.5V15l10.5-4.5v18L22 33.5Z" stroke-width="2.8" stroke-linejoin="round"/><path d="M34.5 12.5c2.6 1.7 3.5 3 3.5 5.5v10c0 2.5-1.2 4-3.8 5.5" stroke-width="2.8" stroke-linecap="round"/></svg></span>
      <span class="marca-flip">Flip</span><span class="marca-pdf">PDF</span>
    </a>
    <div class="barra-acoes">
      <a class="botao-publicar" href="login.html">Já tenho conta</a>
    </div>
  </header>

  <main class="autenticacao">
    <form class="cartao-admin cartao-autenticacao" id="formulario" novalidate>
      <h2>Criar conta grátis</h2>
      <p class="selo-demo">🧪 Demonstração: a conta fica salva apenas neste navegador.
        Nenhum dado é enviado a um servidor.</p>
      <label class="campo">
        <span>Seu nome</span>
        <input id="campo-nome" type="text" maxlength="60" autocomplete="name" required>
      </label>
      <label class="campo">
        <span>E-mail</span>
        <input id="campo-email" type="email" maxlength="80" autocomplete="email" required>
      </label>
      <label class="campo">
        <span>Senha (mínimo 6 caracteres)</span>
        <input id="campo-senha" type="password" minlength="6" autocomplete="new-password" required>
      </label>
      <label class="campo">
        <span>Confirme a senha</span>
        <input id="campo-confirmar" type="password" autocomplete="new-password" required>
      </label>
      <p class="erro-campo" id="erro" hidden></p>
      <button class="botao botao-largo" id="btn-cadastrar" type="submit">Criar conta</button>
      <p class="autenticacao-troca">Já tem conta? <a href="login.html">Entrar</a></p>
    </form>
  </main>

  <script type="module">
    import { cadastrar, usuarioAtual } from './assets/js/conta-simulada.js';

    if (usuarioAtual()) location.href = 'admin.html';

    const el = (id) => document.getElementById(id);
    el('formulario').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const erro = el('erro');
      erro.hidden = true;
      if (el('campo-senha').value !== el('campo-confirmar').value) {
        erro.textContent = 'As senhas não conferem.';
        erro.hidden = false;
        return;
      }
      const botao = el('btn-cadastrar');
      botao.disabled = true;
      try {
        await cadastrar(el('campo-nome').value, el('campo-email').value, el('campo-senha').value);
        location.href = 'admin.html';
      } catch (falha) {
        erro.textContent = falha.message;
        erro.hidden = false;
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
