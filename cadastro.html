<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — FlipPDF</title>
  <link rel="stylesheet" href="assets/css/estilo.css?v=__VERSAO__">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="barra-topo">
    <a class="marca" href="index.html">
      <span class="marca-icone" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
      FlipPDF<span class="ponto">.</span>
    </a>
    <div class="barra-acoes">
      <a class="botao-publicar" href="login.html">Já tenho conta</a>
    </div>
  </header>

  <main class="autenticacao">
    <form class="cartao-admin cartao-autenticacao" id="formulario" novalidate>
      <h2>Criar conta grátis</h2>
      <p class="selo-demo">🧪 Demonstração: a conta fica salva apenas neste navegador.
        Nenhum dado é enviado a um servidor.</p>
      <label class="campo">
        <span>Seu nome</span>
        <input id="campo-nome" type="text" maxlength="60" autocomplete="name" required>
      </label>
      <label class="campo">
        <span>E-mail</span>
        <input id="campo-email" type="email" maxlength="80" autocomplete="email" required>
      </label>
      <label class="campo">
        <span>Senha (mínimo 6 caracteres)</span>
        <input id="campo-senha" type="password" minlength="6" autocomplete="new-password" required>
      </label>
      <label class="campo">
        <span>Confirme a senha</span>
        <input id="campo-confirmar" type="password" autocomplete="new-password" required>
      </label>
      <p class="erro-campo" id="erro" hidden></p>
      <button class="botao botao-largo" id="btn-cadastrar" type="submit">Criar conta</button>
      <p class="autenticacao-troca">Já tem conta? <a href="login.html">Entrar</a></p>
    </form>
  </main>

  <script type="module">
    import { cadastrar, usuarioAtual } from './assets/js/conta-simulada.js';

    if (usuarioAtual()) location.href = 'admin.html';

    const el = (id) => document.getElementById(id);
    el('formulario').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const erro = el('erro');
      erro.hidden = true;
      if (el('campo-senha').value !== el('campo-confirmar').value) {
        erro.textContent = 'As senhas não conferem.';
        erro.hidden = false;
        return;
      }
      const botao = el('btn-cadastrar');
      botao.disabled = true;
      try {
        await cadastrar(el('campo-nome').value, el('campo-email').value, el('campo-senha').value);
        location.href = 'admin.html';
      } catch (falha) {
        erro.textContent = falha.message;
        erro.hidden = false;
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
