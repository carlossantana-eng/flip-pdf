<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — FlipPDF</title>
  <link rel="stylesheet" href="assets/css/estilo.css?v=__VERSAO__">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke='%2388da10' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M24 11c-4.6-3-12.4-3.3-17.2-.8v22c4.8-2.5 12.6-2.2 17.2.8Z'/%3E%3Cpath d='M24 11c4.6-3 12.4-3.3 17.2-.8v22c-4.8-2.5-12.6-2.2-17.2.8Z'/%3E%3Cpath d='M6.8 35.8c4.8-2.5 12.6-2.2 17.2.8 4.6-3 12.4-3.3 17.2-.8'/%3E%3Cpath d='M24 9.5c5.4-1.4 11-.2 14.9 3.2-2.6 7.5-6.4 14.4-11.3 20.1-1 1.2-2.2 2.3-3.6 3 .7-1.9 1-3.7.8-5.5Z'/%3E%3C/svg%3E">
  <script>try { if (localStorage.getItem('plataforma-tema') === 'claro') document.documentElement.dataset.tema = 'claro'; } catch (e) { /* sem armazenamento */ }</script>
  <script src="assets/js/tema.js?v=__VERSAO__" defer></script>
</head>
<body>
  <header class="barra-topo">
    <a class="marca marca-central" href="index.html">
      <img class="marca-imagem marca-imagem--escuro" src="assets/marca/logo-escuro.png" alt="FlipPDF">
      <img class="marca-imagem marca-imagem--claro" src="assets/marca/logo-claro.png" alt="FlipPDF">
    </a>
    <div class="barra-acoes">
      <a class="botao-publicar" href="login.html">Já tenho conta</a>
    </div>
  </header>

  <main class="autenticacao">
    <form class="cartao-admin cartao-autenticacao" id="formulario" novalidate>
      <h2>Criar conta grátis</h2>
      <p class="selo-demo">🧪 Demonstração: a conta fica salva apenas neste navegador.
        Nenhum dado é enviado a um servidor.</p>
      <label class="campo">
        <span>Seu nome</span>
        <input id="campo-nome" type="text" maxlength="60" autocomplete="name" required>
      </label>
      <label class="campo">
        <span>E-mail</span>
        <input id="campo-email" type="email" maxlength="80" autocomplete="email" required>
      </label>
      <label class="campo">
        <span>Senha (mínimo 6 caracteres)</span>
        <input id="campo-senha" type="password" minlength="6" autocomplete="new-password" required>
      </label>
      <label class="campo">
        <span>Confirme a senha</span>
        <input id="campo-confirmar" type="password" autocomplete="new-password" required>
      </label>
      <p class="erro-campo" id="erro" hidden></p>
      <button class="botao botao-largo" id="btn-cadastrar" type="submit">Criar conta</button>
      <p class="autenticacao-troca">Já tem conta? <a href="login.html">Entrar</a></p>
    </form>
  </main>

  <script type="module">
    import { cadastrar, usuarioAtual } from './assets/js/conta-simulada.js';

    if (usuarioAtual()) location.href = 'admin.html';

    const el = (id) => document.getElementById(id);
    el('formulario').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const erro = el('erro');
      erro.hidden = true;
      if (el('campo-senha').value !== el('campo-confirmar').value) {
        erro.textContent = 'As senhas não conferem.';
        erro.hidden = false;
        return;
      }
      const botao = el('btn-cadastrar');
      botao.disabled = true;
      try {
        await cadastrar(el('campo-nome').value, el('campo-email').value, el('campo-senha').value);
        location.href = 'admin.html';
      } catch (falha) {
        erro.textContent = falha.message;
        erro.hidden = false;
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
