name: Publicar estante

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar o manifesto de catálogos
        run: node scripts/gerar-manifesto.mjs

      - name: Enviar manifesto atualizado (se mudou)
        run: |
          if ! git diff --quiet catalogos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalogos.json
            git commit -m "Atualiza manifesto de catálogos"
            git push
          fi

      # Cada publicação carimba os CSS/JS com o hash do commit, para o
      # navegador nunca misturar HTML novo com arquivos antigos em cache.
      - name: Carimbar versão nos arquivos estáticos
        run: |
          VERSAO="${GITHUB_SHA::7}"
          sed -i "s/__VERSAO__/${VERSAO}/g" index.html leitor.html admin.html
          grep -h "v=${VERSAO}" index.html leitor.html admin.html

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Ativa o Pages automaticamente na primeira execução
          # (exige repositório público no plano gratuito do GitHub).
          enablement: true

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
