<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — FlipPDF</title>
  <link rel="stylesheet" href="assets/css/estilo.css?v=__VERSAO__">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke='%23a3e635' stroke-width='2.5' stroke-linejoin='round'%3E%3Cpath d='M22 11 33 4v24l-11 7z' fill='%23a3e635' stroke='%23060803' stroke-width='1.6'/%3E%3Cpath d='M15 14 26 7v24l-11 7z' fill='%23a3e635' stroke='%23060803' stroke-width='1.6'/%3E%3Cpath d='M8 17 19 10v24l-11 7z' fill='%23a3e635' stroke='%23060803' stroke-width='1.6'/%3E%3Cpath d='M7 22l17 9 17-9v13L24 44 7 35z' fill='%230c0f07'/%3E%3Cpath d='M24 31v13' stroke-width='1.8'/%3E%3C/svg%3E">
  <script>try { if (localStorage.getItem('plataforma-tema') === 'claro') document.documentElement.dataset.tema = 'claro'; } catch (e) { /* sem armazenamento */ }</script>
  <script src="assets/js/tema.js?v=__VERSAO__" defer></script>
</head>
<body>
  <header class="barra-topo">
    <a class="marca" href="index.html">
      <span class="marca-icone" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M22 11 33 4v24l-11 7z" fill="currentColor" stroke="#060803" stroke-width="1.6"/><path d="M15 14 26 7v24l-11 7z" fill="currentColor" stroke="#060803" stroke-width="1.6"/><path d="M8 17 19 10v24l-11 7z" fill="currentColor" stroke="#060803" stroke-width="1.6"/><path d="M7 22l17 9 17-9v13L24 44 7 35z" fill="#0c0f07"/><path d="M24 31v13" stroke-width="1.8"/></svg></span>
      <span class="marca-flip">Flip</span><span class="marca-pdf">PDF</span>
    </a>
    <div class="barra-acoes">
      <a class="botao botao-nav" href="cadastro.html">Criar conta grátis</a>
    </div>
  </header>

  <main class="autenticacao">
    <form class="cartao-admin cartao-autenticacao" id="formulario" novalidate>
      <h2>Entrar</h2>
      <p class="selo-demo">🧪 Demonstração: as contas valem apenas neste navegador.</p>
      <label class="campo">
        <span>E-mail</span>
        <input id="campo-email" type="email" maxlength="80" autocomplete="email" required>
      </label>
      <label class="campo">
        <span>Senha</span>
        <input id="campo-senha" type="password" autocomplete="current-password" required>
      </label>
      <p class="erro-campo" id="erro" hidden></p>
      <button class="botao botao-largo" id="btn-entrar" type="submit">Entrar</button>
      <p class="autenticacao-troca">Ainda não tem conta? <a href="cadastro.html">Criar conta grátis</a></p>
      <p class="autenticacao-nota">Esqueceu a senha? Como a conta é uma demonstração local,
        basta <a href="cadastro.html">criar outra</a> com um novo e-mail.</p>
    </form>
  </main>

  <script type="module">
    import { entrar, usuarioAtual } from './assets/js/conta-simulada.js';

    if (usuarioAtual()) location.href = 'admin.html';

    const el = (id) => document.getElementById(id);
    el('formulario').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const erro = el('erro');
      erro.hidden = true;
      const botao = el('btn-entrar');
      botao.disabled = true;
      try {
        await entrar(el('campo-email').value, el('campo-senha').value);
        location.href = 'admin.html';
      } catch (falha) {
        erro.textContent = falha.message;
        erro.hidden = false;
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
