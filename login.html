<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — FlipPDF</title>
  <link rel="stylesheet" href="assets/css/estilo.css?v=__VERSAO__">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke='%23a3e635' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M24 13.5C19.4 10 11.4 10 6.5 13V34c4.9-3 12.9-3 17.5.5Z'/%3E%3Cpath d='M24 13.5c3.2-2.4 7.6-3.3 11.8-2.8'/%3E%3Cpath d='M41.5 14.5V34c-1.9-1.15-4.1-1.85-6.4-2.1'/%3E%3Cpath d='M6.5 37c4.9-3 12.9-3 17.5.5 4.6-3.5 12.6-3.5 17.5-.5'/%3E%3Cpath d='M24 34c1.5-9.8 6.4-18.4 16.4-23.9-3.1 6.8-4.9 14.6-5.3 21.7-3.8-.5-7.8.3-11.1 2.2Z'/%3E%3C/svg%3E">
  <script>try { if (localStorage.getItem('plataforma-tema') === 'claro') document.documentElement.dataset.tema = 'claro'; } catch (e) { /* sem armazenamento */ }</script>
  <script src="assets/js/tema.js?v=__VERSAO__" defer></script>
</head>
<body>
  <header class="barra-topo">
    <a class="marca marca-central" href="index.html">
      <span class="marca-icone" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 13.5C19.4 10 11.4 10 6.5 13V34c4.9-3 12.9-3 17.5.5Z"/><path d="M24 13.5c3.2-2.4 7.6-3.3 11.8-2.8"/><path d="M41.5 14.5V34c-1.9-1.15-4.1-1.85-6.4-2.1"/><path d="M6.5 37c4.9-3 12.9-3 17.5.5 4.6-3.5 12.6-3.5 17.5-.5"/><path d="M24 34c1.5-9.8 6.4-18.4 16.4-23.9-3.1 6.8-4.9 14.6-5.3 21.7-3.8-.5-7.8.3-11.1 2.2Z"/><path d="M27.2 30.6c1.7-6.3 4.8-12.2 9.2-17.2"/></svg></span>
      <span class="marca-flip">Flip</span><span class="marca-pdf">PDF</span>
    </a>
    <div class="barra-acoes">
      <a class="botao botao-nav" href="cadastro.html">Criar conta grátis</a>
    </div>
  </header>

  <main class="autenticacao">
    <form class="cartao-admin cartao-autenticacao" id="formulario" novalidate>
      <h2>Entrar</h2>
      <p class="selo-demo">🧪 Demonstração: as contas valem apenas neste navegador.</p>
      <label class="campo">
        <span>E-mail</span>
        <input id="campo-email" type="email" maxlength="80" autocomplete="email" required>
      </label>
      <label class="campo">
        <span>Senha</span>
        <input id="campo-senha" type="password" autocomplete="current-password" required>
      </label>
      <p class="erro-campo" id="erro" hidden></p>
      <button class="botao botao-largo" id="btn-entrar" type="submit">Entrar</button>
      <p class="autenticacao-troca">Ainda não tem conta? <a href="cadastro.html">Criar conta grátis</a></p>
      <p class="autenticacao-nota">Esqueceu a senha? Como a conta é uma demonstração local,
        basta <a href="cadastro.html">criar outra</a> com um novo e-mail.</p>
    </form>
  </main>

  <script type="module">
    import { entrar, usuarioAtual } from './assets/js/conta-simulada.js';

    if (usuarioAtual()) location.href = 'admin.html';

    const el = (id) => document.getElementById(id);
    el('formulario').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const erro = el('erro');
      erro.hidden = true;
      const botao = el('btn-entrar');
      botao.disabled = true;
      try {
        await entrar(el('campo-email').value, el('campo-senha').value);
        location.href = 'admin.html';
      } catch (falha) {
        erro.textContent = falha.message;
        erro.hidden = false;
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
